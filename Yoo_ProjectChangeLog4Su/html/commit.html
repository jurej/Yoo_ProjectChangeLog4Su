<!DOCTYPE html>
<!-- Commit dialog - Modus UI shell. Dev loop: open in Chrome; bridge.js
     mocks window.sketchup so the UI can be built outside SketchUp. -->
<html lang="en" data-theme="modus-modern-light" data-mode="light" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commit changes</title>

  <!-- Theme bootstrap - must run BEFORE the Modus loader (no FOUC). -->
  <script>
    (function () {
      var pref = "system"; // "light" | "dark" | "system"
      function resolve(m) {
        return m === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : m;
      }
      window.__modusSetTheme = function (m) {
        var mode = resolve(m || pref);
        var el = document.documentElement;
        el.setAttribute("data-theme", mode === "dark" ? "modus-modern-dark" : "modus-modern-light");
        el.setAttribute("data-mode", mode);
        el.classList.remove("light", "dark");
        el.classList.add(mode);
        try { localStorage.setItem("modus-theme-config", JSON.stringify({ theme: "modus-modern", mode: mode })); } catch (e) {}
      };
      window.__modusSetTheme(pref);
    })();
  </script>

  <!-- Modus Web Components 1.19.1 via jsDelivr (PINNED version). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.19.1/modus-wc-styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.19.1/modus-icons.css" />
  <link rel="stylesheet" href="./shared.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.19.1/modus-wc/modus-wc.esm.js"></script>
</head>
<body>
  <modus-wc-card bordered="true" padding="compact">
    <div slot="title" class="dialog-title">
      <modus-wc-typography hierarchy="h4" size="md" weight="semibold" label="Commit changes"></modus-wc-typography>
    </div>

    <div class="form-stack">
      <modus-wc-textarea id="msg" label="What changed in this version?" size="sm" rows="4"
        placeholder="- Add description of changes"></modus-wc-textarea>

      <div class="fieldset">
        <modus-wc-checkbox id="push_to_master" size="sm" label="Push to master (like git push)"></modus-wc-checkbox>
        <div class="path-row">
          <modus-wc-text-input id="master_path" size="sm" label="Master file path"
            placeholder="C:\Projects\MyModel_MASTER.skp"></modus-wc-text-input>
          <modus-wc-button id="btn-browse" variant="outlined" color="tertiary" size="sm">Browse</modus-wc-button>
          <modus-wc-button id="btn-settings" variant="outlined" color="tertiary" size="sm">Settings</modus-wc-button>
        </div>
        <div class="helper-text">The master file is overwritten in place so LayOut links keep working.</div>
      </div>
    </div>

    <div id="result" class="dialog-result" hidden></div>
  </modus-wc-card>

  <div class="dialog-footer">
    <modus-wc-button id="btn-cancel" variant="outlined" color="tertiary" size="sm">Skip</modus-wc-button>
    <modus-wc-button id="btn-submit" variant="filled" color="primary" size="sm">
      <modus-wc-icon name="check" size="xs" decorative></modus-wc-icon>
      Log change
    </modus-wc-button>
  </div>

  <script src="./bridge.js"></script>
  <script src="./commit.js"></script>
</body>
</html>
